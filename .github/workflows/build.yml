name: Build and Release ViaMod

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version (e.g., 1.20.1)'
        required: true
        default: '1.20.1'
      mod_version:
        description: 'Mod Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get Fabric API and ModMenu Versions
        id: get_versions
        run: |
          MC_VERSION="${{ inputs.minecraft_version }}"
          echo "Fetching versions for Minecraft $MC_VERSION..."

          # 1. Fetch Fabric API from Modrinth (Reliable for API)
          FABRIC_API_VERSION=$(curl -s "https://api.modrinth.com/v2/project/P7dR8mSH/version" | \
            jq -r --arg mc "$MC_VERSION" '.[] | select(.game_versions[] == $mc and .loaders[] == "fabric") | .version_number' | head -n 1)

          # 2. Fetch ModMenu from Maven Metadata (Reliable for Maven existence)
          # We fetch the metadata XML which lists ALL available versions, then filter for the MC version
          MAVEN_METADATA=$(curl -s "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml")
          
          # Extract all versions, then find the first one that matches our MC version logic
          # Since Maven lists all versions chronologically, we grep for the MC version and take the last (newest) match
          MODMENU_VERSION=$(echo "$MAVEN_METADATA" | grep -oP '(?<=<version>)[^<]+' | grep "^${MC_VERSION%.*}" | tail -n 1)
          
          # Fallback: If exact major version match fails (e.g. 1.20 vs 1.20.1), try loose match
          if [ -z "$MODMENU_VERSION" ]; then
             MODMENU_VERSION=$(echo "$MAVEN_METADATA" | grep -oP '(?<=<version>)[^<]+' | grep "$MC_VERSION" | tail -n 1)
          fi

          # Validation
          if [ -z "$FABRIC_API_VERSION" ] || [ "$FABRIC_API_VERSION" == "null" ]; then
            echo "::error::Could not find Fabric API for Minecraft $MC_VERSION"
            exit 1
          fi
          
          if [ -z "$MODMENU_VERSION" ]; then
            echo "::error::Could not find ModMenu for Minecraft $MC_VERSION in Maven repository. Available versions might differ."
            # Debug: Print available versions for 1.20
            echo "::notice::Available ModMenu versions containing '1.20':"
            echo "$MAVEN_METADATA" | grep -oP '(?<=<version>)[^<]+' | grep "1.20" || echo "None found."
            exit 1
          fi

          echo "fabric_api_version=$FABRIC_API_VERSION" >> $GITHUB_OUTPUT
          echo "modmenu_version=$MODMENU_VERSION" >> $GITHUB_OUTPUT
          echo "Successfully found:"
          echo "  - Fabric API: $FABRIC_API_VERSION"
          echo "  - ModMenu: $MODMENU_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod
        run: ./gradlew clean build
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          MOD_VERSION: ${{ inputs.mod_version }}
          FABRIC_API_VERSION: ${{ steps.get_versions.outputs.fabric_api_version }}
          MODMENU_VERSION: ${{ steps.get_versions.outputs.modmenu_version }}

      - name: Locate JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*${{ inputs.mod_version }}*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.mod_version }}-${{ inputs.minecraft_version }}"
          name: "ViaMod ${{ inputs.mod_version }} for MC ${{ inputs.minecraft_version }}"
          body: |
            Automated release for ViaMod version ${{ inputs.mod_version }} targeting Minecraft ${{ inputs.minecraft_version }}.
            
            **Included Dependencies:**
            - Fabric API: ${{ steps.get_versions.outputs.fabric_api_version }}
            - ModMenu: ${{ steps.get_versions.outputs.modmenu_version }}
            
            ## Installation
            1. Download the `.jar` file.
            2. Place it in `.minecraft/mods`.
            3. Place older mods in `.minecraft/viamods`.
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.find_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
