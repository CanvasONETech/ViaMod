name: Build and Release ViaMod

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version (e.g., 1.20.1)'
        required: true
        default: '1.20.1'
      mod_version:
        description: 'Mod Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get Fabric API and ModMenu Versions
        id: get_versions
        run: |
          MC_VERSION="${{ inputs.minecraft_version }}"
          echo "Fetching versions for Minecraft $MC_VERSION..."

          # 1. Fetch Fabric API from Modrinth
          FABRIC_API_VERSION=$(curl -s "https://api.modrinth.com/v2/project/P7dR8mSH/version" | \
            jq -r --arg mc "$MC_VERSION" '.[] | select(.game_versions[] == $mc and .loaders[] == "fabric") | .version_number' | head -n 1)

          # 2. Fetch ModMenu from Modrinth API (FIXED: Uses game_versions filter instead of Maven string matching)
          # ModMenu uses semantic versioning (e.g., 7.2.2) which does not contain "1.20.1" in the version string.
          # The Modrinth API correctly maps game compatibility.
          MODMENU_VERSION=$(curl -s "https://api.modrinth.com/v2/project/mOgUt4GM/version" | \
            jq -r --arg mc "$MC_VERSION" '.[] | select(.game_versions[] == $mc and .loaders[] == "fabric") | .version_number' | head -n 1)
          
          # Fallback: Hardcoded mapping for stable releases if API fails or returns empty
          if [ -z "$MODMENU_VERSION" ]; then
            echo "::notice::Modrinth API returned empty, trying fallback mapping..."
            case "$MC_VERSION" in
              "1.20.1") MODMENU_VERSION="7.2.2" ;;
              "1.20.2") MODMENU_VERSION="7.2.2" ;;
              "1.20.3") MODMENU_VERSION="7.2.2" ;; # Often compatible with .4 mods or specific .3 build
              "1.20.4") MODMENU_VERSION="9.2.0" ;;
              "1.20.5") MODMENU_VERSION="10.0.0" ;;
              "1.20.6") MODMENU_VERSION="10.0.0" ;;
              "1.21.0") MODMENU_VERSION="11.0.1" ;;
              "1.21.1") MODMENU_VERSION="11.0.3" ;;
              "1.21.2") MODMENU_VERSION="12.0.0" ;;
              "1.21.3") MODMENU_VERSION="12.0.0" ;;
              "1.21.4") MODMENU_VERSION="13.0.1" ;;
              *) 
                echo "::error::No hardcoded ModMenu version for $MC_VERSION. Please update the script."
                exit 1
                ;;
            esac
          fi

          # Validation
          if [ -z "$FABRIC_API_VERSION" ] || [ "$FABRIC_API_VERSION" == "null" ]; then
            echo "::error::Could not find Fabric API for Minecraft $MC_VERSION"
            exit 1
          fi
          
          if [ -z "$MODMENU_VERSION" ]; then
            echo "::error::Could not find ModMenu for Minecraft $MC_VERSION"
            exit 1
          fi

          echo "fabric_api_version=$FABRIC_API_VERSION" >> $GITHUB_OUTPUT
          echo "modmenu_version=$MODMENU_VERSION" >> $GITHUB_OUTPUT
          echo "Successfully found:"
          echo "  - Fabric API: $FABRIC_API_VERSION"
          echo "  - ModMenu: $MODMENU_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod
        run: ./gradlew clean build
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          MOD_VERSION: ${{ inputs.mod_version }}
          FABRIC_API_VERSION: ${{ steps.get_versions.outputs.fabric_api_version }}
          MODMENU_VERSION: ${{ steps.get_versions.outputs.modmenu_version }}

      - name: Locate JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*${{ inputs.mod_version }}*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::Build successful but no JAR file found matching version ${{ inputs.mod_version }}"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.mod_version }}-${{ inputs.minecraft_version }}"
          name: "ViaMod ${{ inputs.mod_version }} for MC ${{ inputs.minecraft_version }}"
          body: |
            Automated release for ViaMod version ${{ inputs.mod_version }} targeting Minecraft ${{ inputs.minecraft_version }}.
            
            **Included Dependencies:**
            - Fabric API: ${{ steps.get_versions.outputs.fabric_api_version }}
            - ModMenu: ${{ steps.get_versions.outputs.modmenu_version }}
            
            ## Installation
            1. Download the `.jar` file.
            2. Place it in `.minecraft/mods`.
            3. Place older mods in `.minecraft/viamods`.
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.find_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
