name: Build and Release ViaMod

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version (e.g., 1.20.1)'
        required: true
        default: '1.20.1'
      mod_version:
        description: 'Mod Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod
        run: ./gradlew clean build
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          MOD_VERSION: ${{ inputs.mod_version }}

      - name: Locate JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*${{ inputs.mod_version }}*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.mod_version }}-${{ inputs.minecraft_version }}"
          name: "ViaMod ${{ inputs.mod_version }} for MC ${{ inputs.minecraft_version }}"
          body: |
            Automated release for ViaMod version ${{ inputs.mod_version }} targeting Minecraft ${{ inputs.minecraft_version }}.
            
            ## Installation
            1. Download the `.jar` file.
            2. Place it in `.minecraft/mods`.
            3. Place older mods in `.minecraft/viamods`.
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.find_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
