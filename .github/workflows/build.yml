name: Build and Release ViaMod

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version (e.g., 1.20.1)'
        required: true
        default: '1.20.1'
      mod_version:
        description: 'Mod Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get Fabric API and ModMenu Versions
        id: get_versions
        run: |
          MC_VERSION="${{ inputs.minecraft_version }}"
          
          # Fetch latest Fabric API version for the specified MC version
          # We filter specifically for versions that contain the MC version string in the version number
          FABRIC_API_DATA=$(curl -s "https://api.modrinth.com/v2/project/P7dR8mSH/version?loaders=[\"fabric\"]&game_versions=[\"$MC_VERSION\"]")
          FABRIC_API_VERSION=$(echo "$FABRIC_API_DATA" | jq -r '.[0].version_number' | head -n 1)
          
          # Fallback: If the specific query fails, try fetching all and filtering by name
          if [ -z "$FABRIC_API_VERSION" ] || [ "$FABRIC_API_VERSION" == "null" ]; then
             echo "Direct query failed, trying fallback..."
             ALL_VERSIONS=$(curl -s "https://api.modrinth.com/v2/project/P7dR8mSH/version")
             FABRIC_API_VERSION=$(echo "$ALL_VERSIONS" | jq -r --arg mc "$MC_VERSION" '.[] | select(.game_versions[] == $mc and .loaders[] == "fabric") | .version_number' | head -n 1)
          fi

          # Fetch latest ModMenu version
          MODMENU_DATA=$(curl -s "https://api.modrinth.com/v2/project/mOgUt4GM/version?loaders=[\"fabric\"]&game_versions=[\"$MC_VERSION\"]")
          MODMENU_VERSION=$(echo "$MODMENU_DATA" | jq -r '.[0].version_number' | head -n 1)

          # Fallback for ModMenu
          if [ -z "$MODMENU_VERSION" ] || [ "$MODMENU_VERSION" == "null" ]; then
             ALL_MM_VERSIONS=$(curl -s "https://api.modrinth.com/v2/project/mOgUt4GM/version")
             MODMENU_VERSION=$(echo "$ALL_MM_VERSIONS" | jq -r --arg mc "$MC_VERSION" '.[] | select(.game_versions[] == $mc and .loaders[] == "fabric") | .version_number' | head -n 1)
          fi

          if [ -z "$FABRIC_API_VERSION" ] || [ "$FABRIC_API_VERSION" == "null" ]; then
            echo "Error: Could not find Fabric API for Minecraft $MC_VERSION"
            exit 1
          fi
          
          if [ -z "$MODMENU_VERSION" ] || [ "$MODMENU_VERSION" == "null" ]; then
            echo "Error: Could not find ModMenu for Minecraft $MC_VERSION"
            exit 1
          fi

          echo "fabric_api_version=$FABRIC_API_VERSION" >> $GITHUB_OUTPUT
          echo "modmenu_version=$MODMENU_VERSION" >> $GITHUB_OUTPUT
          echo "Found Fabric API: $FABRIC_API_VERSION"
          echo "Found ModMenu: $MODMENU_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod
        run: ./gradlew clean build
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          MOD_VERSION: ${{ inputs.mod_version }}
          FABRIC_API_VERSION: ${{ steps.get_versions.outputs.fabric_api_version }}
          MODMENU_VERSION: ${{ steps.get_versions.outputs.modmenu_version }}

      - name: Locate JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*${{ inputs.mod_version }}*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.mod_version }}-${{ inputs.minecraft_version }}"
          name: "ViaMod ${{ inputs.mod_version }} for MC ${{ inputs.minecraft_version }}"
          body: |
            Automated release for ViaMod version ${{ inputs.mod_version }} targeting Minecraft ${{ inputs.minecraft_version }}.
            
            **Included Dependencies:**
            - Fabric API: ${{ steps.get_versions.outputs.fabric_api_version }}
            - ModMenu: ${{ steps.get_versions.outputs.modmenu_version }}
            
            ## Installation
            1. Download the `.jar` file.
            2. Place it in `.minecraft/mods`.
            3. Place older mods in `.minecraft/viamods`.
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.find_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
