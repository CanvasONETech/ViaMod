plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = System.getenv("MOD_VERSION") ?: "1.0.0"
def targetMcVersion = System.getenv("MINECRAFT_VERSION") ?: "1.20.1"
def fabricApiVersion = System.getenv("FABRIC_API_VERSION")
def modMenuVersion = System.getenv("MODMENU_VERSION")

if (!fabricApiVersion || !modMenuVersion) {
    throw new GradleException("FABRIC_API_VERSION and MODMENU_VERSION environment variables must be set by GitHub Actions.")
}

base {
    archivesName = "ViaMod"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    
    // Ensure the JAR is compatible with Java 17 (Minecraft 1.20.1)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Explicitly force the compiler to output Java 17 bytecode
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    // REQUIRED: Add TerraformersMC repository for ModMenu
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    
    // Optional: Modrinth Maven as a fallback for other mods
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMcVersion}"
    mappings "net.fabricmc:yarn:${targetMcVersion}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    
    modImplementation "com.terraformersmc:modmenu:${modMenuVersion}"
}

processResources {
    inputs.property "version", version
    
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}
